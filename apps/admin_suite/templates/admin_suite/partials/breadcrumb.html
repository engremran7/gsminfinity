{% if breadcrumb %}
<nav class="text-sm text-slate-600 mb-4" aria-label="Breadcrumb">
  <ol class="flex flex-wrap items-center gap-2">
    {% for crumb in breadcrumb %}
      {% if crumb.url %}
        <li><a class="text-primary hover:underline" href="{{ crumb.url }}">{{ crumb.label }}</a></li>
      {% else %}
        <li class="font-semibold text-slate-800">{{ crumb.label }}</li>
      {% endif %}
      {% if not forloop.last %}
        <li class="text-slate-400">/</li>
      {% endif %}
    {% endfor %}
  </ol>
</nav>
{% if subtitle %}
  <p class="text-sm text-slate-500 -mt-2 mb-4">{{ subtitle }}</p>
{% endif %}
{% endif %}
