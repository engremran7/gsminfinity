<div id="admin-cmd" class="hidden fixed inset-0 bg-black/30 backdrop-blur-sm z-50 items-start justify-center pt-24">
  <div class="bg-white w-full max-w-xl mx-auto rounded-xl shadow-lg border border-slate-200 overflow-hidden">
    <div class="px-4 py-3 border-b border-slate-200 flex items-center gap-2">
      <span class="text-xs text-slate-500">Search</span>
      <input
        id="admin-cmd-input"
        type="search"
        placeholder="Jump to… (type to filter)"
        class="flex-1 text-sm border border-slate-200 rounded-md px-3 py-2 focus:outline-none focus:border-slate-400"
        autocomplete="off"
      />
      <button id="admin-cmd-close" type="button" class="text-xs text-slate-500 hover:text-slate-800">Esc</button>
    </div>
    <div id="admin-cmd-results" class="max-h-80 overflow-y-auto divide-y divide-slate-100">
      <div class="px-4 py-3 text-sm text-slate-500">Type to search admin pages…</div>
    </div>
  </div>
</div>
