{% load static %}
<header class="bg-white shadow-sm border-b border-slate-200">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="{% url 'admin_suite:admin_suite' %}" class="flex items-center gap-2 text-slate-900 font-semibold">
        <img src="{% static 'img/default-logo.svg' %}" alt="Admin" class="h-7 w-7">
        <span>Admin Suite</span>
      </a>
      <span class="text-xs text-slate-500">Enterprise control plane</span>
    </div>
    <div class="flex items-center gap-3">
      <div class="relative">
        <button
          type="button"
          id="admin-cmd-toggle"
          class="text-sm border border-slate-200 rounded-full px-3 py-1.5 w-56 text-left bg-white hover:bg-slate-50"
          aria-label="Admin search"
        >
          <span class="text-slate-500">Search or jump (?/Ctrl+K)</span>
        </button>
      </div>
      <a href="{% url 'pages:home' %}" class="text-sm px-3 py-1.5 rounded border border-slate-200 bg-white hover:bg-slate-50">
        ⇐ Back to site
      </a>
      <a href="{% url 'admin_suite:admin_suite' %}" class="text-sm px-3 py-1.5 rounded border border-slate-200 bg-white hover:bg-slate-50">
        Admin home
      </a>
      <a href="{% url 'admin:index' %}" class="text-sm px-3 py-1.5 rounded border border-slate-200 bg-white hover:bg-slate-50">
        Django admin
      </a>
    </div>
  </div>
</header>
