{% load static %}
<div class="topbar card bg-panel shadow">
  <div class="brand">
    <img src="{% static 'img/default-logo.svg' %}" alt="Admin" class="h-7 w-7">
    <div>
      <div class="fw-800">Admin Suite</div>
      <div class="text-xs text-muted">Enterprise control plane</div>
    </div>
    <span class="badge">Admin</span>
  </div>
  <div class="search">
    <span class="icon">🔍</span>
    <input id="admin-cmd-toggle" type="button" value="Search or jump (?/Ctrl+K)" aria-label="Admin search" />
  </div>
  <div class="flex items-center gap-2 justify-end">
    <a href="{% url 'home' %}" class="btn secondary">Back to site</a>
    <a href="{% url 'account_logout' %}" class="btn">Logout</a>
  </div>
</div>
