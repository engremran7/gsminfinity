{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Reset Password</title>
  <link href="{% static 'css/admin/enterprise.css' %}" rel="stylesheet" />
  <link href="{% static 'css/admin/auth.css' %}" rel="stylesheet" />
  <link href="{% static 'css/admin/components.css' %}" rel="stylesheet" />
  <link href="{% static 'css/admin/forms.css' %}" rel="stylesheet" />
  <link href="{% static 'css/admin/motion.css' %}" rel="stylesheet" />
</head>
<body class="admin-login">
  <div class="admin-page">
    <div class="admin-card">
      <div class="admin-brand">
        <img src="{% static 'img/default-logo.svg' %}" alt="Admin Suite" />
        <span>Admin Suite</span>
        <span class="tag">Recovery</span>
      </div>
      <p class="muted muted-spacing">Set a new password for your admin account.</p>

      <form method="post" class="admin-form">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <div>
          <label for="{{ form.new_password1.id_for_label }}">New password</label>
          {{ form.new_password1 }}
        </div>
        <div>
          <label for="{{ form.new_password2.id_for_label }}">Confirm password</label>
          {{ form.new_password2 }}
        </div>
        <button type="submit" class="btn">Update password</button>
      </form>

      <div class="muted muted-spacing"><a href="{% url 'admin_suite:admin_suite_login' %}" class="link-btn">Back to Admin Login</a></div>
    </div>
  </div>
</body>
</html>
