{% extends "admin_suite/base.html" %}

{% block title %}Admin Suite - App Registry{% endblock %}

{% block content %}
<div class="space-y-6">
  <div class="border rounded-lg bg-white shadow-sm overflow-hidden">
    <div class="px-4 py-3 border-b">
      <h2 class="text-lg font-semibold text-slate-900">Registry Flags</h2>
    </div>
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-slate-200">
        <thead class="bg-slate-50 text-left text-xs font-semibold text-slate-600">
          <tr>
            <th class="px-4 py-2">Key</th>
            <th class="px-4 py-2">Value</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100 text-sm text-slate-800">
          {% for k, v in registry.items %}
          <tr>
            <td class="px-4 py-2">{{ k }}</td>
            <td class="px-4 py-2">{{ v }}</td>
          </tr>
          {% empty %}
          <tr><td colspan="2" class="px-4 py-3 text-slate-500">No registry data.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
