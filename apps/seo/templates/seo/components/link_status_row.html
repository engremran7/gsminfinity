
<tr>
  <td class="py-1 max-w-xs truncate text-slate-700">
    <a href="{{ entry.url }}" target="_blank" rel="noopener noreferrer" title="{{ entry.url }}">
      {{ entry.url }}
    </a>
  </td>
  <td class="py-1">
    <span class="px-2 py-1 rounded text-xs {{ status_class|default:'' }}">
      {{ entry.last_status|default:"(unknown)" }}
    </span>
  </td>
  <td class="py-1 text-xs text-slate-500">{{ entry.last_checked_at|default:"n/a" }}</td>
</tr>
