{% extends "admin/change_list.html" %}
{% load static %}

{% block extrastyle %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'css/admin/django-admin-custom.css' %}">
{% endblock %}

{% block content %}
<div class="user-admin-stats">
    <div class="stat-card">
        <h3>Total Users</h3>
        <div class="number">{{ cl.result_count }}</div>
    </div>
    <div class="stat-card">
        <h3>Active Users</h3>
        <div class="number" id="active-count">-</div>
    </div>
    <div class="stat-card">
        <h3>Staff Members</h3>
        <div class="number" id="staff-count">-</div>
    </div>
    <div class="stat-card">
        <h3>Verified Emails</h3>
        <div class="number" id="verified-count">-</div>
    </div>
</div>

<script nonce="{{ request.csp_nonce }}">
(function() {
    // Fetch user stats from API if available
    const activeEl = document.getElementById('active-count');
    const staffEl = document.getElementById('staff-count');
    const verifiedEl = document.getElementById('verified-count');
    
    // Simple placeholder - would ideally fetch from admin API
    activeEl.textContent = '{{ cl.result_list|length }}';
    staffEl.textContent = '...';
    verifiedEl.textContent = '...';
})();
</script>

{{ block.super }}
{% endblock %}
