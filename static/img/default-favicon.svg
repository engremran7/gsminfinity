<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="GSMInfinity Favicon">
  <defs>
    <linearGradient id="favGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00A3CC;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#1A1A2E"/>
  
  <!-- Phone outline -->
  <rect x="9" y="3" width="14" height="22" rx="2.5" ry="2.5" fill="none" stroke="url(#favGradient)" stroke-width="1.5"/>
  <rect x="13" y="5" width="6" height="1.5" rx="0.75" fill="url(#favGradient)" opacity="0.6"/>
  
  <!-- Medical cross in circle -->
  <circle cx="16" cy="12" r="4" fill="none" stroke="url(#favGradient)" stroke-width="1.2"/>
  <path d="M16 9.5v5M13.5 12h5" stroke="url(#favGradient)" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Infinity symbol (simplified stethoscope) -->
  <path d="M10 28 C7 28, 6 26, 8 25 C10 24, 12 25, 16 25 C20 25, 22 24, 24 25 C26 26, 25 28, 22 28 C20 28, 18 27, 16 27 C14 27, 12 28, 10 28Z" 
        fill="none" stroke="url(#favGradient)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
