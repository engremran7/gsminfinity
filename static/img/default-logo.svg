<svg xmlns="http://www.w3.org/2000/svg" width="160" height="40" viewBox="0 0 160 40" role="img" aria-label="GSMInfinity Logo">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00A3CC;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Phone outline -->
  <rect x="4" y="2" width="18" height="32" rx="3" ry="3" fill="none" stroke="url(#logoGradient)" stroke-width="1.8"/>
  <rect x="9" y="4" width="8" height="2" rx="1" fill="url(#logoGradient)" opacity="0.6"/>
  
  <!-- Medical cross in circle -->
  <circle cx="13" cy="14" r="6" fill="none" stroke="url(#logoGradient)" stroke-width="1.2"/>
  <path d="M13 10v8M9 14h8" stroke="url(#logoGradient)" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Stethoscope tube going to infinity -->
  <path d="M13 20 C13 24, 8 26, 4 28 C-2 31, -2 37, 6 37 C10 37, 12 34, 16 34 C20 34, 22 37, 26 37 C34 37, 34 31, 28 28 C24 26, 19 24, 19 20" 
        fill="none" stroke="url(#logoGradient)" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Stethoscope earpieces -->
  <circle cx="6" cy="37" r="2" fill="url(#logoGradient)"/>
  <circle cx="26" cy="37" r="2" fill="url(#logoGradient)"/>
  
  <!-- Text: GSMINFINITY -->
  <text x="38" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#F0F4F8" letter-spacing="0.5">
    GSM<tspan fill="url(#logoGradient)">INFINITY</tspan>
  </text>
</svg>
