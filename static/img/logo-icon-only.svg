<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" role="img" aria-label="GSMInfinity Icon">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00A3CC;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Phone outline -->
  <rect x="10" y="2" width="20" height="30" rx="3.5" ry="3.5" fill="none" stroke="url(#iconGradient)" stroke-width="2"/>
  <rect x="16" y="4.5" width="8" height="2" rx="1" fill="url(#iconGradient)" opacity="0.6"/>
  
  <!-- Medical cross in circle -->
  <circle cx="20" cy="14" r="6" fill="none" stroke="url(#iconGradient)" stroke-width="1.5"/>
  <path d="M20 10v8M16 14h8" stroke="url(#iconGradient)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Infinity/Stethoscope -->
  <path d="M12 36 C6 36, 5 32, 10 30 C14 28.5, 17 30, 20 30 C23 30, 26 28.5, 30 30 C35 32, 34 36, 28 36 C24 36, 22 34, 20 34 C18 34, 16 36, 12 36Z" 
