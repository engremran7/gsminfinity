
{% load account %}
<p>Hello {{ user_display }},</p>
<p>You requested a password reset for {{ current_site.name|default:"your account" }}.</p>
<p>
  <strong>Reset link:</strong><br>
  <a href="{{ protocol }}://{{ domain }}{% url 'account_reset_password_from_key' uidb36=uid token=token %}">
    Reset your password
  </a>
</p>
<p><strong>Verification code (for inline entry):</strong><br>{{ token }}</p>
<p>If you did not request this, you can ignore this email.</p>
