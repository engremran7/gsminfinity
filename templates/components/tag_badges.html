
{% with tag_list=tags|default:None %}
  {% if tag_list %}
    <div class="flex flex-wrap gap-2 text-xs">
      {% for tag in tag_list %}
        {% if url_name and tag.slug %}
          <a href="{% url url_name tag.slug %}"
             class="inline-flex items-center px-2.5 py-1 rounded-full bg-[var(--primitive-cyan-500)]/10 text-[var(--primitive-cyan-400)] border border-[var(--primitive-cyan-500)]/30 hover:bg-[var(--primitive-cyan-500)]/20 hover:shadow-[0_0_10px_var(--primitive-cyan-500)/30] transition-all">
            #{{ tag.name|default:tag }}
          </a>
        {% else %}
          <span class="inline-flex items-center px-2.5 py-1 rounded-full bg-[var(--color-bg-surface-secondary)] text-[var(--color-text-secondary)] border border-[var(--color-border-subtle)]">#{{ tag.name|default:tag }}</span>
        {% endif %}
      {% empty %}
        <span class="text-[var(--color-text-muted)]">No tags</span>
      {% endfor %}
    </div>
  {% else %}
    <div class="flex flex-wrap gap-2 text-xs">
      <span class="text-[var(--color-text-muted)]">No tags</span>
    </div>
  {% endif %}
{% endwith %}
