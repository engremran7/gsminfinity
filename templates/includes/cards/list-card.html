
<div class="card-glass p-6">
  <h3 class="text-lg font-medium text-[var(--color-text-primary)] mb-4">{{ title }}</h3>

  {% if items %}
  <ul class="divide-y divide-[var(--color-border-default)]">
    {% for item in items %}
    <li class="py-2 flex justify-between">
      <span class="text-[var(--color-text-secondary)]">{{ item.label }}</span>
      <span class="text-[var(--color-text-primary)] font-medium">{{ item.value }}</span>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="text-[var(--color-text-muted)] text-sm">No data available.</p>
  {% endif %}
</div>
