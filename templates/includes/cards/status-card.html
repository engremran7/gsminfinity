
<div class="card-glass p-6">
  {% if title %}
  <div class="text-sm text-[var(--color-text-muted)] mb-2">{{ title }}</div>
  {% endif %}
  <div class="text-2xl font-semibold text-[var(--color-text-primary)]">
    {{ value|default:"0" }}
  </div>
  {% if description %}
  <div class="text-[var(--color-text-secondary)] text-sm mt-2">{{ description }}</div>
  {% endif %}
</div>
