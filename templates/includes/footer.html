
{% load static i18n %}
<footer class="bg-[var(--primitive-gray-900)] text-[var(--color-text-secondary)] py-4 border-t border-[var(--color-border-default)]">
  <div class="w-full px-4 sm:px-6 lg:px-8">
    <div class="flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex flex-wrap items-center justify-center gap-4 text-xs">
        <a href="{% url 'pages:page' slug='privacy' %}" class="text-[var(--color-text-muted)] hover:text-[var(--primitive-cyan-400)] transition-colors">Privacy</a>
        <a href="{% url 'pages:page' slug='terms' %}" class="text-[var(--color-text-muted)] hover:text-[var(--primitive-cyan-400)] transition-colors">Terms</a>
        <a href="{% url 'pages:page' slug='cookies' %}" class="text-[var(--color-text-muted)] hover:text-[var(--primitive-cyan-400)] transition-colors">Cookies</a>
        <a href="{% url 'pages:sitemap' %}" class="text-[var(--color-text-muted)] hover:text-[var(--primitive-cyan-400)] transition-colors">Sitemap</a>
      </div>
      <div class="flex items-center gap-4">
        {% get_current_language as LANGUAGE_CODE %}
        {% get_available_languages as LANGUAGES %}
        <form method="post" action="{% url 'set_language' %}" class="inline-flex items-center gap-1 text-xs">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ request.path }}">
          <svg class="icon w-3 h-3 text-[var(--color-text-muted)]" aria-hidden="true"><use href="#icon-globe"></use></svg>
          <select id="lang-switch-footer" name="language" aria-label="Select language" class="text-xs bg-transparent text-[var(--color-text-muted)] border-0 py-0 focus:outline-none focus:ring-1 focus:ring-[var(--primitive-cyan-500)]">
            {% for code, name in LANGUAGES %}
            <option value="{{ code }}"{% if code == LANGUAGE_CODE %} selected{% endif %} class="bg-[var(--color-bg-page)] text-[var(--color-text-primary)]">{{ name }}</option>
            {% endfor %}
          </select>
        </form>
        <span class="text-xs text-[var(--color-text-muted)]">
          {% now "Y" as current_year %}
          &copy; {{ current_year }} {{ site_settings.site_name|default:"" }}
        </span>
      </div>
    </div>
  </div>
</footer>
