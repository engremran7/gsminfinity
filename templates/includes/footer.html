
{% load static i18n_theme_tags %}
<footer class="bg-slate-800 text-slate-200 py-6">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
    <div class="mb-3">
      <a
        href="{% url 'site_settings:privacy_policy' %}"
        class="text-slate-200 hover:underline mx-2"
        >Privacy</a
      >
      <a
        href="{% url 'site_settings:terms_of_service' %}"
        class="text-slate-200 hover:underline mx-2"
        >Terms</a
      >
      <a
        href="{% url 'site_settings:cookies_policy' %}"
        class="text-slate-200 hover:underline mx-2"
        >Cookies</a
      >
      <a
        href="{% url 'core:site_map' %}"
        class="text-slate-200 hover:underline mx-2"
        >Site map</a
      >
      <form method="post" action="{% url 'i18n_themes:switch' %}" class="inline-flex items-center gap-2 px-3 py-1 rounded border border-slate-600 bg-slate-700 ml-3 align-middle">
        {% csrf_token %}
        <svg class="icon w-4 h-4 text-slate-200" aria-hidden="true"><use href="#icon-globe"></use></svg>
        {% get_i18n_locales as switch_locales %}
        <select name="locale" class="text-xs bg-slate-700 text-slate-100 border-slate-600 rounded px-2 py-1">
          {% for loc in switch_locales %}
          <option value="{{ loc.code }}">{{ loc.name|default:loc.code }}</option>
          {% endfor %}
        </select>
      </form>
    </div>
    <div class="text-sm">
      {% now "Y" as current_year %}
      &copy; {{ current_year }} {{ site_settings.site_name|default:"" }} - All rights reserved.
    </div>
  </div>
</footer>
