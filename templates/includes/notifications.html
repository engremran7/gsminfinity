{# Futuristic HUD toast notifications container #}
{% if messages %}
<div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm" role="region" aria-label="Notifications" aria-live="polite">
  {% for msg in messages %}
  <div 
    class="toast-item flex items-center gap-3 p-4 rounded-xl shadow-lg border backdrop-blur-xl animate-slide-in
           {% if msg.tags == 'error' %}bg-[var(--primitive-red-500)]/20 border-[var(--primitive-red-500)]/50 text-[var(--primitive-red-400)]
           {% elif msg.tags == 'success' %}bg-[var(--primitive-neon-500)]/20 border-[var(--primitive-neon-500)]/50 text-[var(--primitive-neon-400)]
           {% elif msg.tags == 'warning' %}bg-[var(--primitive-yellow-500)]/20 border-[var(--primitive-yellow-500)]/50 text-[var(--primitive-yellow-400)]
           {% else %}bg-[var(--color-bg-glass)] border-[var(--color-border-default)] text-[var(--color-text-primary)]{% endif %}"
    role="alert"
  >
    {# Icon based on message type #}
    <span class="flex-shrink-0" aria-hidden="true">
      {% if msg.tags == 'error' %}
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>
      {% elif msg.tags == 'success' %}
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
      {% elif msg.tags == 'warning' %}
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
      {% else %}
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg>
      {% endif %}
    </span>
    
    <span class="flex-1 text-sm font-medium">{{ msg }}</span>
    
    <button 
      type="button" 
      data-dismiss="toast"
      class="flex-shrink-0 p-1 rounded-lg opacity-70 hover:opacity-100 hover:bg-[var(--color-interactive-hover)] transition-all focus:outline-none focus:ring-2 focus:ring-[var(--primitive-cyan-500)]"
      aria-label="Dismiss notification"
    >
      <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
    </button>
  </div>
  {% endfor %}
</div>

<script nonce="{{ request.csp_nonce }}">
// Auto-dismiss toasts after 5 seconds
document.querySelectorAll('.toast-item').forEach(toast => {
  setTimeout(() => {
    toast.style.transition = 'opacity 0.3s, transform 0.3s';
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(100%)';
    setTimeout(() => toast.remove(), 300);
  }, 5000);
});
</script>
{% endif %}
