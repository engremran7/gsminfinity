
{# templates/partials/notification_list.html #}

<div class="card notification-card">
  <div class="card-header d-flex justify-content-between">
    Notifications
    <form action="{% url 'users_notifications:mark_all' %}" method="post" class="d-inline">
      {% csrf_token %}
      <button class="btn btn-sm btn-link">Mark all read</button>
    </form>
  </div>

  <ul class="list-group list-group-flush" id="notif-list">
    {% for n in notifications %}
    <li class="list-group-item {% if not n.is_read %}bg-light{% endif %}">
      <div class="d-flex justify-content-between">
        <div>
          <strong>{{ n.title }}</strong>
          <div class="small text-muted">
            {{ n.created_at|date:"SHORT_DATETIME_FORMAT" }}
          </div>

          <!-- FIXED: replaced n.body → n.message -->
          <div class="small">{{ n.message|truncatechars:100 }}</div>
        </div>

        <div class="ms-2">
          <form action="{% url 'users_notifications:mark_read' n.id %}" method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-sm btn-outline-secondary">
              Mark read
            </button>
          </form>
        </div>
      </div>
    </li>
    {% empty %}
    <li class="list-group-item">No notifications</li>
    {% endfor %}
  </ul>
</div>
